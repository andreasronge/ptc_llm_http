name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Independent jobs, and a superseded pull-request run is cancelled rather than
# left to burn a matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEX_SPONSOR: false

jobs:
  quality:
    name: Format, compile, Credo
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/quality.sh

  test:
    name: Tests (current toolchain)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/tests.sh

  # Socket, TLS, and DNS behavior differ between platforms, and this package is
  # a transport. macOS is a first-class target, not a courtesy run.
  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/tests.sh

  # Verifies the Elixir version the package *declares*, on the package's real
  # consumer surface: only runtime dependencies are fetched, so no dev or test
  # tooling can mask an incompatible library. Tests cannot run here -- the lint
  # and property tooling needs a newer Elixir than the declaration -- which is
  # what the `compat` job below is for.
  declared-minimum:
    name: Declared minimum Elixir compiles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.8'
          otp-version: '26.2.5'
      - run: scripts/ci/minimum-elixir.sh

  # The declared OTP floor, running the whole suite.
  #
  # `mix.exs` requires OTP 26 or later, established by the socket/TLS spike and
  # explained in docs/transport-backend.md. This job is where that claim is
  # tested rather than asserted: the transport conformance suite runs here, so
  # a socket or TLS behavior that differs on the oldest supported release fails
  # the build. The Elixir version is the oldest the lint and property tooling
  # supports, which is above the declared `elixir: "~> 1.15"`; the
  # `declared-minimum` job covers that end.
  #
  # ubuntu-22.04 is deliberate -- precompiled OTP 26 builds are published for
  # it, not for 24.04.
  compat:
    name: Minimum supported OTP
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          elixir-version: '1.18.4'
          otp-version: '26.2.5'
      - run: scripts/ci/tests.sh --include compat

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'true'
      - run: scripts/ci/dialyzer.sh

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
      - run: scripts/ci/docs.sh

  release-package:
    name: Release smoke and package contents
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: prod
      - run: scripts/ci/release.sh
      - run: scripts/ci/package.sh
      - run: scripts/ci/deps.sh
      - run: scripts/ci/minimum-elixir.sh
