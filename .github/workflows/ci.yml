name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Independent jobs, and a superseded pull-request run is cancelled rather than
# left to burn a matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEX_SPONSOR: false

jobs:
  quality:
    name: Format, compile, Credo, duplication
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/quality.sh

  test:
    name: Tests (current toolchain)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/tests.sh

  # Socket, TLS, and DNS behavior differ between platforms, and this package is
  # a transport. macOS is a first-class target, not a courtesy run.
  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: scripts/ci/tests.sh

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'true'
      - run: scripts/ci/dialyzer.sh

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
      - run: scripts/ci/docs.sh

  release-package:
    name: Release smoke and package contents
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: prod
      - run: scripts/ci/release.sh
      - run: scripts/ci/package.sh
      - run: scripts/ci/deps.sh
      - run: scripts/ci/minimum-elixir.sh
